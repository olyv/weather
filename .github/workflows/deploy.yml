name: Deploy Weather App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Cloud Instances
        uses: appleboy/ssh-action@v1.0.3
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MQTT_HOST: ${{ secrets.MQTT_HOST }}
          MQTT_PORT: ${{ secrets.MQTT_PORT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          host: ${{ secrets.HOST_IP }}
          username: opc 
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TELEGRAM_TOKEN,TELEGRAM_CHAT_ID,MQTT_HOST,MQTT_PORT,GEMINI_API_KEY
          script: |
            set -e

            # 0. Install required packages
            sudo dnf install -y git
            
            # 1. Clone or pull the codebase
            if [ ! -d "/home/opc/weather" ]; then
              git clone https://github.com/olyv/weather.git /home/opc/weather
              cd /home/opc/weather
            else
              cd /home/opc/weather
              git pull origin main
            fi
            
            # 2. Generate the .env file securely on the server
            echo "MQTT_HOST=$MQTT_HOST" > .env
            echo "MQTT_PORT=$MQTT_PORT" >> .env
            echo "TELEGRAM_TOKEN=$TELEGRAM_TOKEN" >> .env
            echo "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID" >> .env
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
            
            # 3. Rebuild and deploy the containers
            sudo docker compose up -d --build --remove-orphans