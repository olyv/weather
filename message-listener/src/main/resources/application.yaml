spring:
  main:
    web-application-type: none
  datasource:
    driver-class-name: org.sqlite.JDBC
    hikari:
      connection-init-sql: "PRAGMA journal_mode=WAL; PRAGMA synchronous=NORMAL;"
  sql:
    init:
      mode: always
  ai:
    vertex:
      ai:
        gemini:
          project-id: ${GCP_PROJECT_ID}
          location: us-central1

# MQTT Broker Settings
mqtt:
  client:
    id: spring-boot-weather-consumer
  topic: bme280-weather
  completion-timeout: 5000
  qos: 1

# purge data older than
cutoff:
  days: 3

# Telegram
telegram:
  bot:
    token: ${TELEGRAM_TOKEN}
  chat:
    id: ${TELEGRAM_CHAT_ID}

